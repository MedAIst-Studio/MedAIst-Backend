name: Build and Push Docker Image

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Name and Tag
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "SUFFIX=-prod" >> $GITHUB_OUTPUT
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "SUFFIX=-dev" >> $GITHUB_OUTPUT
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Appends the suffix (-prod or -dev) to the image name
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ steps.config.outputs.SUFFIX }}
          # Sets the tag to specific value (latest or dev)
          tags: |
            type=raw,value=${{ steps.config.outputs.TAG }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy Application
        if: success()
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            APPLICATION_ID="${{ secrets.PROD_APP_ID }}"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            APPLICATION_ID="${{ secrets.DEV_APP_ID }}"
          else
            echo "Skipping deployment for non-main/dev branch"
            exit 0
          fi
          
          curl -X POST 'https://panel.medaist.com/api/trpc/application.deploy?batch=1' \
            -H 'accept: */*' \
            -H 'content-type: application/json' \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            --data-raw "{\"0\":{\"json\":{\"applicationId\":\"${APPLICATION_ID}\"}}}"
