    type: object
  auth.ExchangeResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  auth.SignupRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.SignupResponse:
    type: object
  chat.Chat:
    properties:
      created_at:
        type: string
      file_id:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  chat.Message:
    properties:
      content:
        type: string
      is_user:
        type: boolean
      timestamp:
        type: string
    type: object
  file.File:
    properties:
      created_at:
        type: string
      id:
        type: string
      size:
        type: integer
      title:
        type: string
    type: object
  file.UploadFileRequest:
    type: object
  file.UploadFileResponse:
    type: object
  message.SendMessageRequest:
    properties:
      chat_id:
        type: string
      content:
        minLength: 1
        type: string
      pdf_id:
        type: string
    required:
    - content
    - pdf_id
    type: object
  message.SendMessageResponse:
    properties:
      ai_message_id:
        type: string
      ai_response:
        type: string
      chat_id:
        type: string
      title:
        type: string
      user_message_id:
        type: string
    type: object
  quiz.GenerateQuizRequest:
    properties:
      endPage:
        type: integer
      fileId:
        type: string
      fileName:
        type: string
      startPage:
        type: integer
    required:
    - fileId
    - fileName
    type: object
  quiz.GenerateQuizResponse:
    type: object
  quiz.GetQuizByIdResponse:
    properties:
      id:
        type: string
      questions:
        items:
          $ref: '#/definitions/quiz.Question'
        type: array
      title:
        type: string
    type: object
  quiz.Option:
    properties:
      label:
        type: string
      text:
        type: string
    type: object
  quiz.Question:
    properties:
      correct_option:
        type: string
      "no":
        type: integer
      options:
        items:
          $ref: '#/definitions/quiz.Option'
        type: array
      text:
        type: string
    type: object
  quiz.QuizSummary:
    properties:
      createdAt:
        type: string
      quizId:
        type: string
      title:
        type: string
    type: object
  user.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  user.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  user.GetCurrentUserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      isEmailVerified:
        type: boolean
      username:
        type: string
    type: object
  user.ResetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  user.UpdateUsernameRequest:
    properties:
      address:
        type: string
      username:
        type: string
    required:
    - address
    - username
    type: object
  user.VerifiyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
info:
  contact: {}
  description: |2-

    ## How to use the API
    1- Click which endpoint you want to use.
    2- Click "Try it out" button.
    3- Add your request body or your parameters which are showed and required by the endpoint.
    4- Click "Execute" button.
    5- You will see the response.

    Some endpoints require authentication. In this case, you need to log in first.
    I created two types of users for this project: admin and regular user.
    Just send a POST request as below at [here](http://localhost:3000/swagger/index.html/).
    After login, you will get a JWE token in cookies.
    If you're using cookie-based auth, the cookie will be sent automatically.
    Alternatively, you can use Bearer Token authentication via the "Authorize" button.

    ### Login Request For Admin
    ```json
    {
    "email": "admin@admin.com",
    "password": "admin123"
    }
    ```

    ### Login Request For User
    ```json
    {
    "email": "user@user.com",
    "password": "user1234"
    }
    ```

    ## Error Handling
    All error responses will follow this JSON format:

    ```json
    {
    "message": string,
    "code": int
    }
    ```
    ### Example
    ```json
    {
    "message": "invalid request",
    "code": 400
    }
    ```

    ## Reminder
    I did not use `/api` prefix for the endpoint routes. Because I love to host my API on "api" subdomain.
    Status code with `2xx` is a success code.
    Status code with `4xx` is a client error code.
    Status code with `5xx` is a server error code.
  title: MedAIist-Backend API
  version: "1.0"
paths:
  /api/auth/exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: Exchange Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ExchangeResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Exchange OAuth2 tokens
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user or admin
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Removes the refresh token from the database.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
      summary: Logout user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Generate a new access token using a valid refresh token.
        The API takes refresh token from req body the sends  a new access token.
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshTokenResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Refresh access token
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Signup a new user
      parameters:
      - description: Signup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SignupResponse'
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Signup
      tags:
      - Auth
  /chats:
    get:
      consumes:
      - application/json
      description: Retrieves a list of chats associated with the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chat.Chat'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve chats for the authenticated user
      tags:
      - Chats
  /chats/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete Chat
      tags:
      - Chats
    get:
      consumes:
      - application/json
      description: Retrieves all messages associated with a specific chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chat.Message'
            type: array
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve messages for a specific chat
      tags:
      - Chats
  /files:
    get:
      consumes:
      - application/json
      description: Retrieves a list of files associated with the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/file.File'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve files for the authenticated user
      tags:
      - Files
  /files/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a file and its associated data
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete a file
      tags:
      - Files
    get:
      consumes:
      - application/json
      description: Retrieve a file by its ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get File
      tags:
      - files
  /files/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a file to the server
        This endpoint allows authenticated users to upload a file. The file will be processed and stored.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/file.UploadFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/file.UploadFileResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Upload a file
      tags:
      - Files
  /healthcheck:
    get:
      consumes:
      - application/json
      description: Check the health of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      summary: Healthcheck
      tags:
      - Healthcheck
  /messages:
    post:
      consumes:
      - application/json
      description: Sends a message in a chat and gets a response from the AI
      parameters:
      - description: Send Message Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/message.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.SendMessageResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Send a message in a chat
      tags:
      - Message
  /quizzes:
    get:
      consumes:
      - application/json
      description: Retrieve a list of quizzes for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/quiz.QuizSummary'
            type: array
        "500":
          description: Internal Server Error
      summary: Get Quizzes
      tags:
      - Quiz
    post:
      consumes:
      - application/json
      description: Generate a quiz based on the provided file
      parameters:
      - description: Generate Quiz request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/quiz.GenerateQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quiz.GenerateQuizResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Generate Quiz
      tags:
      - Quiz
  /quizzes/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a quiz by its ID for the authenticated user
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/quiz.GetQuizByIdResponse'
        "404":
          description: Not Found
      summary: Get Quiz by ID
      tags:
      - Quiz
  /users/account:
    delete:
      description: Delete a user's account
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete User Account
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: Update a user's account information
      parameters:
      - description: Update User Account Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUsernameRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update User Account
      tags:
      - User
  /users/forgot-password:
    post:
      consumes:
      - application/json
      description: It sends  a password reset link to the user's email address.
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Forgot Password
      tags:
      - User
  /users/password:
    patch:
      consumes:
      - application/json
      description: Change the password of a user
      parameters:
      - description: Change User Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Change User Password
      tags:
      - User
  /users/profile:
    get:
      consumes:
      - application/json
      description: Get the current user. Requires Bearer token authentication.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.GetCurrentUserResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get Current User
      tags:
      - User
  /users/reset-password:
    post:
      consumes:
      - application/json
      description: It resets a user's password using a token.
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Reset Password
      tags:
      - User
  /users/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies a user's email address using a token
      parameters:
      - description: Verify Email Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.VerifiyEmailRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Verify user email
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: Enter your Bearer token in the format **Bearer &lt;token&gt;**
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
