  textproto.MIMEHeader:
    additionalProperties:
      items:
        type: string
      type: array
    type: object
info:
  contact: {}
  description: |2-

    ## How to use the API
    1- Click which endpoint you want to use.
    2- Click "Try it out" button.
    3- Add your request body or your parameters which are showed and required by the endpoint.
    4- Click "Execute" button.
    5- You will see the response.

    Some endpoints require authentication. In this case, you need to log in first.
    I created two types of users for this project: admin and regular user.
    Just send a POST request as below at [here](http://localhost:3000/swagger/index.html/).
    After login, you will get a JWE token in cookies.
    If you're using cookie-based auth, the cookie will be sent automatically.
    Alternatively, you can use Bearer Token authentication via the "Authorize" button.

    ### Login Request For Admin
    ```json
    {
    "email": "admin@admin.com",
    "password": "admin123"
    }
    ```

    ### Login Request For User
    ```json
    {
    "email": "user@user.com",
    "password": "user1234"
    }
    ```

    ## Error Handling
    All error responses will follow this JSON format:

    ```json
    {
    "message": string,
    "code": int
    }
    ```
    ### Example
    ```json
    {
    "message": "invalid request",
    "code": 400
    }
    ```

    ## Reminder
    I did not use `/api` prefix for the endpoint routes. Because I love to host my API on "api" subdomain.
    Status code with `2xx` is a success code.
    Status code with `4xx` is a client error code.
    Status code with `5xx` is a server error code.
  title: MedAIist-Backend API
  version: "1.0"
paths:
  /admin/users:
    post:
      consumes:
      - application/json
      description: Retrieve a list of all users
      parameters:
      - description: Get Users request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_admin.GetUsersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_admin.UserInfo'
            type: array
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Get Users
      tags:
      - Admin
  /api/auth/exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: Exchange Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_auth.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_auth.ExchangeResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Exchange OAuth2 tokens
  /api/auth/oauth/mobile:
    post:
      consumes:
      - application/json
      description: Authenticate user via Google or Facebook mobile tokens.
      parameters:
      - description: Mobile Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/infrastructure_oauth.MobileLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure_oauth.OAuthTokens'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mobile OAuth Login
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user or admin
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_auth.LoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Removes the refresh token from the database.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
      summary: Logout user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Generate a new access token using a valid refresh token.
        The API takes refresh token from req body the sends  a new access token.
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_auth.RefreshTokenResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Refresh access token
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Signup a new user
      parameters:
      - description: Signup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_auth.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_auth.SignupResponse'
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Signup
      tags:
      - Auth
  /chats:
    get:
      consumes:
      - application/json
      description: Retrieves a list of chats associated with the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_chat.Chat'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve chats for the authenticated user
      tags:
      - Chats
  /chats/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete Chat
      tags:
      - Chats
    get:
      consumes:
      - application/json
      description: Retrieves all messages associated with a specific chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_chat.Message'
            type: array
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve messages for a specific chat
      tags:
      - Chats
    patch:
      consumes:
      - application/json
      description: Updates the title of a chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: New Title
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateChatRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update Chat Title
      tags:
      - Chats
  /files:
    get:
      consumes:
      - application/json
      description: Retrieves a list of files associated with the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_file.File'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve files for the authenticated user
      tags:
      - Files
  /files/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a file and its associated data
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete a file
      tags:
      - Files
    get:
      consumes:
      - application/json
      description: Retrieve a file by its ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get File
      tags:
      - files
  /files/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a file to the server
        This endpoint allows authenticated users to upload a file. The file will be processed and stored.
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_file.UploadFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_file.UploadFileResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Upload a file
      tags:
      - Files
  /healthcheck:
    get:
      consumes:
      - application/json
      description: Check the health of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
      summary: Healthcheck
      tags:
      - Healthcheck
  /messages:
    post:
      consumes:
      - application/json
      description: Sends a message in a chat and gets a response from the AI
      parameters:
      - description: Send Message Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_message.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_message.SendMessageResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Send a message in a chat
      tags:
      - Message
  /quizzes:
    get:
      consumes:
      - application/json
      description: Retrieve a list of quizzes for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_quiz.QuizSummary'
            type: array
        "500":
          description: Internal Server Error
      summary: Get Quizzes
      tags:
      - Quiz
    post:
      consumes:
      - application/json
      description: Generate a quiz based on the provided file
      parameters:
      - description: Generate Quiz request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_quiz.GenerateQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_quiz.GenerateQuizResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Generate Quiz
      tags:
      - Quiz
  /quizzes/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a quiz by its ID for the authenticated user
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_quiz.GetQuizByIdResponse'
        "404":
          description: Not Found
      summary: Get Quiz by ID
      tags:
      - Quiz
  /quizzes/{id}/solve:
    post:
      consumes:
      - application/json
      description: Submit answers for a quiz and get the score with detailed feedback
      parameters:
      - description: Quiz ID
        in: path
        name: id
        required: true
        type: string
      - description: Solve Quiz request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_quiz.SolveQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_quiz.SolveQuizResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Solve Quiz
      tags:
      - Quiz
  /quizzes/attempts:
    get:
      consumes:
      - application/json
      description: Get all quiz attempts for the current user
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_quiz.GetQuizAttemptsResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Get Quiz Attempts
      tags:
      - Quiz
  /quizzes/attempts/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific quiz attempt by its ID for the authenticated
        user
      parameters:
      - description: Attempt ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_quiz.GetAttemptByIdResponse'
        "404":
          description: Not Found
      summary: Get Quiz Attempt by ID
      tags:
      - Quiz
  /users/account:
    delete:
      description: Delete a user's account
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete User Account
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: Update a user's account information
      parameters:
      - description: Update User Account Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_user.UpdateUsernameRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update User Account
      tags:
      - User
  /users/forgot-password:
    post:
      consumes:
      - application/json
      description: It sends  a password reset link to the user's email address.
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
