steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/scope-backend', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scope-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scope-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/scope-backend'
      - '--region'
      - 'europe-west3'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'cloud-run-builder@scope-486312.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY